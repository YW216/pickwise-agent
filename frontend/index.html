<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <title>PickWise 选购助手</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">PICKWISE / 3C DECISION ASSISTANT</p>
          <h1>选购助手</h1>
        </div>
        <div class="topbar-actions">
          <span id="session-status" class="status-pill">正在连接</span>
        </div>
      </header>

      <section class="workspace" aria-label="PickWise 工作区">
        <aside class="session-panel" aria-label="会话列表">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">CONVERSATIONS</p>
              <h2>会话</h2>
            </div>
            <button id="new-session" class="icon-button" type="button" title="新建会话" aria-label="新建会话">+</button>
          </div>
          <div id="session-list" class="session-list" aria-live="polite"></div>
        </aside>

        <section class="chat-panel">
          <div id="messages" class="messages" aria-live="polite"></div>
          <div id="chat-error" class="inline-error" role="alert" hidden></div>
          <form id="chat-form" class="composer">
            <label class="sr-only" for="message-input">输入你的需求</label>
            <textarea
              id="message-input"
              rows="3"
              maxlength="8000"
              placeholder="例如：我想买一台 6000 元以内、适合写代码的笔记本"
              required
            ></textarea>
            <div class="composer-footer">
              <span class="hint">Enter 发送，Shift + Enter 换行</span>
              <button id="send-button" class="button button-primary" type="submit">
                发送 <span aria-hidden="true">↗</span>
              </button>
            </div>
          </form>
        </section>

        <aside class="catalog-panel" aria-label="商品检索">
          <div class="panel-heading">
            <div>
              <p class="eyebrow">CATALOG SEARCH</p>
              <h2>商品检索</h2>
            </div>
            <span class="panel-mark" aria-hidden="true">⌕</span>
          </div>
          <p class="panel-copy">把自然语言需求交给语义检索，查看当前目录中的候选商品。</p>
          <form id="product-form" class="product-form">
            <label class="sr-only" for="product-query">搜索商品</label>
            <input id="product-query" type="text" maxlength="500" placeholder="搜索商品或使用场景" required />
            <button class="button button-secondary" type="submit">检索</button>
          </form>
          <div id="product-results" class="product-results" aria-live="polite">
            <div class="empty-state">还没有商品检索结果。</div>
          </div>
        </aside>
      </section>
    </main>
    <script src="/app.js" defer></script>
  </body>
</html>
